# Image tags pinned 2026-11-06. Keep bgutil's tag equal to the pip plugin version in the Dockerfile.
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: encore
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"          # no /dev/net/tun needed: works in an unprivileged LXC
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    restart: unless-stopped

  encore:
    build: .
    network_mode: service:tailscale # reachable only through the tailnet
    env_file: .env
    volumes:
      - ./data:/data
    depends_on: [tailscale, bgutil]
    restart: unless-stopped

  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped
